<!-- The Hamburger Button (Visible only on mobile) -->
<button class="menu-toggle" id="menu-toggle" aria-label="Toggle navigation">
  <span class="hamburger-bar"></span>
  <span class="hamburger-bar"></span>
  <span class="hamburger-bar"></span>
</button>

<!-- Your Mobile Links Container (Initially hidden on mobile via CSS) -->
<div class="link-wrapper-mobile" id="link-wrapper-mobile">
  {%- for platform in site.sidebar %}
  <nobr>
    <a href="{{ platform.link }}" rel="me">{{ platform.icon }}&nbsp;{{ platform.name }}</a>
    {%- unless forloop.last %}<span class="link-divider"></span>{% endunless %}
  </nobr>
  {%- endfor %}
</div>
