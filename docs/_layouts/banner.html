---
layout: default
---

<!-- Global Fixed Banner Block -->
<div class="custom-site-banner" style="background-image: url('{{ site.global_banner.image | relative_url }}');">
  <div class="banner-overlay">
    <div class="banner-inner-text">
      <h1 style="color: {{ site.global_banner.title_color | default: '#ffffff' }};">
        {{ page.title | default: site.global_banner.title }}
      </h1>
      <p style="color: {{ site.global_banner.subtitle_color | default: '#eeeeee' }};">
        {{ site.global_banner.subtitle }}
      </p>
    </div>
  </div>
</div>

<!-- Main Markdown Content Spacer Wrapper -->
<div class="main-content layout-banner-spacer">
  {{ content }}
</div>
