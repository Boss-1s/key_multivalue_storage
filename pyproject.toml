[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "key-multivalue-storage"
version = "1.2.2.20260506.2"
description = "A simple library that allows the JSON storage of one key to multiple values."
readme = "README.md"
requires-python = ">=3.12"
license = {text = "GPLv2"}
authors = [
    {name = "Boss_1s", email = "95505913+Boss-1s@users.noreply.github.com"}
]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: GNU General Public License v2 (GPLv2)",
    "Natural Language :: English",
    "Programming Language :: Python :: 3",
    "Topic :: Database",
    "Topic :: File Formats :: JSON",
    "Topic :: Software Development :: Libraries",
    "Topic :: Utilities",
]

[project.optional-dependencies]
dev = ["pylint"]

[project.urls]
Documentation = "https://github.com/Boss-1s/key_multivalue_storage/wiki/"
Repository = "https://github.com/Boss-1s/key_multivalue_storage/"
Issues = "https://github.com/Boss-1s/key_multivalue_storage/issues/"

