[dependency-groups]
dev = [
    { include-group = "test" },
    { include-group = "release" },
    { include-group = 'site' }
]
release = [
    "gitpython>=3.1.53",
    "md-toc>=9.0.0",
    "packaging>=26.2",
    "requests>=2.34.2",
    "rich>=15.0.0",
]
site = [
    "markdown>=3.10.2",
    "mdx-gh-links>=0.4",
    "markdownify >=1.2.3"
]
test = [
    "pylint>=4.0.6",
    "pylint-per-file-ignores>=3.2.1",
    "pyproject>=1!0.2.1",
]
