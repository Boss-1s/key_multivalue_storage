name: Bug report
description: File a bug report.
title: "[Bug]: "
labels: ["bug"]
assignees: ["Boss-1s"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for taking the time to fill out this bug report! Please be sure to read through our [Contribution Guideline](https://github.com/Boss-1s/key_multivalue_storage/blob/main/docs/CONTRIBUTING.md), there are some very important things that you must read before continuing. Thanks!
  - type: input
    id: kmsv
    attributes:
      label: kms version
      description: |
        The version of kms you have installed. Can be found using `python -m pip show key-multivalue-storage`. 
        [See more about versioning here](https://github.com/Boss-1s/key_multivalue_storage/blob/main/docs/SECURITY.md#pypi-versioning)
      placeholder: '1.2.2.20260515.2'
    validations:
      required: true
  - type: textarea
    id: what-happened
    attributes:
      label: What happened?
      description: Describe the bug. What happened? What did you expect?
    validations:
      required: true
  - type: textarea
    id: code
    attributes:
      label: Your Python code
      description: Put your code here. Be careful not to reveal any sensitive data.
      render: python
    validations:
      required: true
  - type: textarea
    id: traceback
    attributes:
      label: Traceback
      description: If you received a traceback, please copy paste the full traceback here.
      render: sh
    validations:
      required: false
  - type: checkboxes
    id: prerequisites
    attributes:
      label: Prerequisite Checks
      description: Please make sure you have done the following, and check them off as follows. This is necessary to prevent false postives, duplicate issues, or unreleated bugs from being reported here. Thanks!
      options:
        - label: I have checked the roadmap and have ensured that the bug I am reporting is not a known bug.
          required: true
        - label: I have checked other issues and have ensured that this is not a duplicate, and has not been reported before.
          required: true
        - label: I am using a supported version of kms (kms-semver1.2.0 and later).
          required: true
        - label: I have ensured that the bug is not in mmy code, but rather is truly because of this library.
          required: true
