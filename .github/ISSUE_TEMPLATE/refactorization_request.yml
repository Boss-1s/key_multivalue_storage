name: Refactorization Request
title: "feat: "
description: Request a feature and/or enhancement.
labels: ["refactor", "Needs Triage"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for taking the time to share your ideas! Please be sure to read through our [Contribution Guideline](https://github.com/Boss-1s/key_multivalue_storage/blob/main/docs/CONTRIBUTING.md), there are some very important things that you must read before continuing. Thanks!
  - type: textarea
    id: desc
    attributes:
      label: "What's the request?"
      description: "Describe the refactorization request. What will it change? What will it do?"
    validations:
      required: true
  - type: textarea
    id: prob
    attributes:
      label: "Why should this be refactored?"
      description: "Describe the problem that this reqest will solve. How will it make it easier for maintainers to do thier jobs? How will it keep things running smoothly? It could be as simple as, 'easier readibility'!"
    validations:
      required: true
  - type: dropdown
    id: file
    attributes:
      label: |
        Which module[s] do[es] this request apply to? (Note: glob patterns are used)
        For automations, please open a feature request issue or a blank issue instead.
      options:
        - key_multivalue_storage/*
        - key_multivalue_storage/**
        - key_multivalue_storage/__init__.py
        - key_multivalue_storage/storage.py
        - key_multivalue_storage/storage.pyi
        - key_multivalue_storage/load.py
        - key_multivalue_storage/edit.py
        - key_multivalue_storage/delete.py
        - key_multivalue_storage/utils/*
        - key_multivalue_storage/utils/warnings.py
        - key_multivalue_storage/utils/exceptions.py
        - key_multivalue_storage/utils/metadata.py
        - test/*
        - test/__main__.py
        - test/test-storage.py
        - test/test-load.py
        - test/test-edit.py
        - test/test-delete.py
        - test/test-meta.py
        - test/test-exceptions.py
        - test/diff.py
      multiple: true
    validations:
      required: true
  - type: textarea
    id: info
    attributes:
      label: Additional Information
  - type: checkboxes
    id: prerequisites
    attributes:
      label: Prerequisite Checks
      description: Please make sure you have done the following, and check them off as follows. This is necessary to prevent duplicate requests or unreleated features from being suggested here. Thanks! *(Remember that you cannot suggest features for unsupported versions.)*
      options:
        - label: I have checked other issues and have ensured that this is not a duplicate, and has not been suggested before.
          required: true
        - label: I am requesting the above refactorization on behalf of a supported version of kms (kms-semver1.3.0 and later).
          required: true
        - label: "**I request that my request, if accepted, not be shown on the roadmap.** (All accepted requests will be added to the roadmap by default.)"
          required: false
