name: Regenerate Changelog (trigger)

on:
  workflow_dispatch: 
  release:
    types: [edited]

jobs:
  trigger:
    runs-on: ubuntu-latest
    steps:
      - uses: peter-evans/repository-dispatch@v4.0.1
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          event-type: regenerate-changelog
          client-payload: '{"ref": "docs"}' # Sends the branch details
