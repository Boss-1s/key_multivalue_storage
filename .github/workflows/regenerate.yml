name: Regenerate Changelog

on:
    workflow_dispatch: # still allowing CLI trigger
    repository_dispatch:
        types: [regenerate-changelog]

jobs:
    generate:
        runs-on: ubuntu-latest
        permissions: write-all
        steps:
            - name: Checkout repository
              uses: actions/checkout@v7

            - name: Install SSH Key
              uses: webfactory/ssh-agent@v0.10.0
              with:
                ssh-private-key: ${{ secrets.SSH_PRIVATE_KEY }}
            
            - name: Setup SSH and signing
              env:
                SSH_PRIVATE_KEY: ${{ secrets.SSH_PRIVATE_KEY }}
              run: bash .github/workflows/src/ssh.sh

            - name: Set up Python
              uses: actions/setup-python@v7

            - name: Set up UV
              uses: astral-sh/setup-uv@v7
              with:
                enable-cache: true

            - name: Install dependencies
              run: uv sync --only-group release

            - name: (Re)Generate Changelog
              env:
                GITHUB_TOKEN: ${{ github.token }}
              run: uv run python test/automation/changelog_generate.py
            
            - name: Commit and Push Changes
              env:
                BRANCH: "docs"
                DUMMY: "false"
                REPO: ${{ github.repository }}
                CUSTOM_COMMIT_MSG: "changelog regenerated"
              run: bash .github/workflows/src/push.sh

            - name: Run pages build and deployment
              env:
                GH_TOKEN: ${{ github.token }}
              run: gh workflow run .github/workflows/jekyll-gh-pages.yml --ref docs
