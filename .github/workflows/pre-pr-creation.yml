name: Pre-PR Jobs
run-name: pr-automation

on:
  pull_request:
    types: [opened, reopened, ready_for_review]
    branches-ignore: 
      - "backport/**"

jobs:
  comment:
    if: ${{!contains(github.head_ref, 'backport/')}}
    runs-on: ubuntu-latest
    permissions:
      pull-requests: write
    steps:
      - parallel:
        - uses: actions/checkout@v7
        - run: sudo apt-get update && sudo apt-get install -y --no-install-recommends jq
      - env:
          GITHUB_TOKEN: ${{github.token}}
          GH_REPO: ${{github.repository}}
          PR_NUMBER: ${{github.event.pull_request.number}}
        if: ${{ github.actor != 'renovate[bot]' && github.actor != 'dependabot[bot]' && github.actor != 'github-actions[bot]'}}
        shell: bash
        run: |
          gh pr edit "$PR_NUMBER" --repo "$GH_REPO" --add-label "Needs Triage" 
          gh pr comment "$PR_NUMBER" \
            --repo "$GH_REPO" \
            --body "Thanks for taking time to submit this PR! Your PR will be triaged soon. If you have any comments or additions, you can make a new comment or edit your original post. Thanks for contributing to kms! *Note: your PR may be closed if it does not comply to [the rules](https://boss-1s.github.io/key_multivalue_storage/Development#pr-rules). Double check and make sure your PR is compliant.*"
          exit 0
      - env:
          GITHUB_TOKEN: ${{github.token}}
          GH_REPO: ${{github.repository}}
          PR_NUMBER: ${{github.event.pull_request.number}}
        if: ${{ github.actor == 'renovate[bot]' || github.actor == 'dependabot[bot]' }}
        shell: bash
        run: |
          MILESTONE_TITLE=$(gh api "repos/$GH_REPO/milestones?state=open&sort=due_on&direction=asc" --jq '[.[] | select(.due_on != null and (.title | startswith("kms-semver1.3."))))[0].title')

          if [ -n "$MILESTONE_TITLE" ] && [ "$MILESTONE_TITLE" != "null" ]; then
            gh pr edit $PR_NUMBER --repo $GH_REPO --milestone "$MILESTONE_TITLE"
          fi

          gh pr edit $PR_NUMBER --repo $GH_REPO --add-label "Priority: Low" --add-label "dependencies"
          exit 0
