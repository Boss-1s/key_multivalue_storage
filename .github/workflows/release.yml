name: Release
description: Workflow for official releases to PyPi, run when a release is created on GitHub.

on:
  workflow_dispatch: 
  release:
    types: [published]

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: "release"
    permissions:
      id-token: write
      contents: write
      artifact-metadata: write
      attestations: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
          
      - name: Install SSH Key
        uses: webfactory/ssh-agent@v0.10.0
        with:
          ssh-private-key: ${{ secrets.SSH_PRIVATE_KEY }}
      
      - name: Setup SSH and signing
        env:
          SSH_PRIVATE_KEY: ${{ secrets.SSH_PRIVATE_KEY }}
        run: bash .github/workflows/src/ssh.sh
        
      - name: Set up Python
        uses: actions/setup-python@v7

      - name: Set up UV
        uses: astral-sh/setup-uv@v9.0.0
        with:
          enable-cache: true

      - name: Automatically Update Version
        env:
          NVERSION: ${{ github.event.release.tag_name }}
          RELEASENVERSION: ${{ github.event.release.name }}
        run: python3 test/automation/release.py

      - name: Install Build Tools Sync venv
        run: |
          python -m pip install --upgrade pip
          python -m pip install build
          uv sync --group release

      - name: Build Package
        run: python -m build # Generates the dist/ files

      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1

      - name: Generate Github Attestations
        # GH's attestations are different from PyPI's.
        uses: actions/attest@v4.2.0
        id: gh-attest
        with:
          subject-path: "dist/*"

      - name: Commit version change
        continue-on-error: true
        env:
          REF: ${{ github.event.release.tag_name }}
          DUMMY: "false"
          REPO: ${{ github.repository }}
          CUSTOM_COMMIT_MSG: "version update"
        run: |
          # AI-Generated (Google AI Mode, Gemini 2.5)
          # 1. Safely evaluate environment variables without syntax parsing flaws
          BRANCH=$(curl -s "https://api.github.com/repos/$REPO/releases/tags/$REF" | grep "target_commitish" | head -n 1 | cut -d '"' -f 4)

          export BRANCH
          
          echo "$REF is sourced from branch: $BRANCH"
          
          # 2. Realign HEAD onto the tracking stream 
          git checkout -B "$BRANCH" "origin/$BRANCH"
          
          bash .github/workflows/src/push.sh

      - name: Rename files for GH release upload
        run: |
          cd dist || exit 1
          for file in *; do
            new_name=$(echo "$file" | sed 's/key_multivalue_storage/kms_package/')
            mv "$file" "$new_name"
          done
          cd ..

      - name: Upload Build to Release
        uses: softprops/action-gh-release@v3
        with:
          files: |
            dist/*
            ${{steps.gh-attest.outputs.bundle-path}}
