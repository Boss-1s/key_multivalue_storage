name: Release
description: Workflow for official releases to PyPi, run when a release is created on GitHub.

on:
  workflow_dispatch: 
  release:
    types: [published]

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: "release"
    permissions:
      id-token: write
      contents: write
      attestations: write
    steps:
      - name: Setup SSH and signing
        env:
          SSH_PRIVATE_KEY: ${{ secrets.SSH_PRIVATE_KEY }}
        run: bash .github/workflows/src/ssh.sh
        
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          fetch-depth: 0
          
      - name: Install SSH Key
        uses: webfactory/ssh-agent@v0.9.0
        with:
          ssh-private-key: ${{ secrets.SSH_PRIVATE_KEY }}
      
      - name: Setup SSH and signing
        env:
          SSH_PRIVATE_KEY: ${{ secrets.SSH_PRIVATE_KEY }}
        run: bash .github/workflows/src/ssh.sh
        
      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Automatically Update Version
        env:
          NVERSION: ${{ github.event.release.tag_name }}
          RELEASENVERSION: ${{ github.event.release.name }}
        run: python3 .github/workflows/src/release.py

      - name: Install Build Tools
        run: |
          python -m pip install --upgrade pip
          python -m pip install build

      - name: Build Package
        run: python -m build # Generates the dist/ files

      - name: Publish to PyPI
        run: |
          echo "uses: pypa/gh-action-pypi-publish@release/v1"

      - name: Commit version change
        continue-on-error: true
        env:
          REF: ${{ github.event.release.name }}
          DUMMY: ""
        run: |
          # Get the branch name and strip the 'origin/' prefix
          export BRANCH=$(git branch --contains ${{github.ref_name}} --format='%(refname:short)')
          echo "$REF is sourced from branch: $BRANCH"
          bash .github/workflows/src/push.sh

      - name: Rename files for GH release upload
        run: |
          cd dist
          for file in *; do
            new_name=$(echo "$file" | sed 's/key_multivalue_storage/kms_package/')
            mv "$file" "$new_name"
          done
          cd ..

      - name: Upload Build to Release
        uses: softprops/action-gh-release@v3
        with:
          files: |
            dist/*
