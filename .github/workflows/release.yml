name: Release
description: Workflow for official releases to PyPi, run when a release is created on GitHub.

on:
  workflow_dispatch:
  release:
    types: [published]

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: "release"
    permissions:
      id-token: write
      contents: write
      artifact-metadata: write
      attestations: write
      issues: write
      actions: read
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Check for successful test environment
        env:
          GH_TOKEN: ${{ github.token }}
          REF: ${{ github.event.release.tag_name || github.ref_name }}
          REPO: ${{ github.repository }}
        run: |
          set -euo pipefail

          TARGET_COMMITISH="$(
            gh api "repos/$REPO/releases/tags/$REF" \
              --jq '.target_commitish'
          )"

          if [ -z "$TARGET_COMMITISH" ] || [ "$TARGET_COMMITISH" = "null" ]; then
            echo "::error::Could not determine target commit for release $REF"
            exit 1
          fi

          BRANCH="$TARGET_COMMITISH"

          # target_commitish may be a commit SHA rather than a branch name.
          if [[ "$TARGET_COMMITISH" =~ ^[0-9a-fA-F]{40}$ ]]; then
            BRANCH="$(
              git for-each-ref \
                --format='%(refname:short)' \
                refs/remotes/origin \
                --contains "$TARGET_COMMITISH" |
              sed 's|^origin/||' |
              grep -v '^HEAD$' |
              head -n 1
            )"
          fi

          if [ -z "$BRANCH" ]; then
            echo "::error::Could not resolve source branch for release ref: $REF"
            exit 1
          fi

          echo "$REF is sourced from branch: $BRANCH"

          CONCLUSION="$(
            gh api \
              --method GET \
              "repos/$REPO/actions/workflows/test.yml/runs" \
              -f "branch=$BRANCH" \
              -f "per_page=1" \
              --jq '.workflow_runs[0].conclusion // empty'
          )"

          echo "Latest test conclusion: ${CONCLUSION:-not found}"

          if [ "$CONCLUSION" != "success" ]; then
            echo "::error::The latest test deployment was not successful."
            git push origin --delete "$REF" || true
            exit 1
          fi

      - name: Install SSH Key
        uses: webfactory/ssh-agent@e83874834305fe9a4a2997156cb26c5de65a8555
        with:
          ssh-private-key: ${{ secrets.SSH_PRIVATE_KEY }}

      - name: Setup SSH and signing
        env:
          SSH_PRIVATE_KEY: ${{ secrets.SSH_PRIVATE_KEY }}
        run: bash .github/workflows/src/ssh.sh

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.14"

      - name: Set up UV
        uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7
        with:
          enable-cache: true

      - name: Automatically Update Version
        env:
          NVERSION: ${{ github.event.release.tag_name }}
          RELEASENVERSION: ${{ github.event.release.name }}
        run: python3 test/automation/release.py

      - name: Install Build Tools Sync venv
        run: |
          python -m pip install --upgrade pip
          python -m pip install build
          uv sync --group release

      - name: Build Package
        run: python -m build # Generates the dist/ files

      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33

      - name: Generate Github Attestations
        # GH's attestations are different from PyPI's.
        uses: actions/attest@v4.2.2
        id: gh-attest
        with:
          subject-path: "dist/*"

      - name: Commit version change
        continue-on-error: true
        env:
          REF: ${{ github.event.release.tag_name }}
          DUMMY: "false"
          REPO: ${{ github.repository }}
          CUSTOM_COMMIT_MSG: ${{ github.event.release.tag_name }}
        run: |
          TARGET_COMMITISH=$(curl -s "https://api.github.com/repos/$REPO/releases/tags/$REF" | grep "target_commitish" | head -n 1 | cut -d '"' -f 4)

          BRANCH="$TARGET_COMMITISH"
          if [[ "$TARGET_COMMITISH" =~ ^[0-9a-f]{40}$ ]]; then
            BRANCH=$(git for-each-ref --format='%(refname:short)' refs/remotes/origin --contains "$TARGET_COMMITISH" | grep -v '^origin/HEAD$' | sed 's|^origin/||' | head -n 1)
          fi

          if [ -z "$BRANCH" ]; then
            echo "Could not resolve source branch for release ref: $REF"
            exit 1
          fi

          export BRANCH

          echo "$REF is sourced from branch: $BRANCH"

          git checkout -B "$BRANCH" "origin/$BRANCH"

          bash .github/workflows/src/push.sh

      - name: Force tag to new commit
        env:
          REF: ${{ github.event.release.tag_name }}
        run: |
          git tag -f "$REF"
          git push origin "$REF" --force

      - name: Rename files for GH release upload
        run: |
          cd dist || exit 1
          for file in *; do
            new_name=$(echo "$file" | sed 's/key_multivalue_storage/kms_package/')
            mv "$file" "$new_name"
          done
          cd ..

      - name: Upload Build to Release
        uses: softprops/action-gh-release@a4f117a9dd5572319a486154ec1147aebabd285c
        with:
          files: |
            dist/*
            ${{steps.gh-attest.outputs.bundle-path}}

      - name: Remind to Bump Past Version
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          gh issue create \
            --title "release reminder: Bump Past Version" \
            --body "Please remember to bump the version past this one. The tag should have \`dev\` in it. Use the script located at test/automation/post-release.py." \
            --assignee @me
