name: code-server

on:
  workflow_dispatch:
    inputs:
      time:
        type: number
        default: 60
        required: true
        description: time to run server in mins

jobs:
  debug-environment:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      packages: write
    steps:
    - uses: actions/checkout@v7
      with:
        fetch-depth: 0
    - name: Log in to GitHub Container Registry
      uses: docker/login-action@v4
      with:
        registry: ghcr.io
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}
    - uses: devcontainers/ci@v0.3
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        # Pass the token here; the binary reads it automatically from the env
        VSCODE_SERVER_TOKEN: ${{ secrets.vs_token }}
      with:
        imageName: ghcr.io/boss-1s/key_multivalue_storage/devcontainer
        cacheFrom: ghcr.io/boss-1s/key_multivalue_storage/devcontainer:latest
        eventFilterForPush:
        runCmd: |
          echo "=== Downloading VS Code CLI ==="
          curl -Lk 'https://update.code.visualstudio.com/latest/cli-alpine-x64/stable' --output vscode_cli.tar.gz
          tar -xf vscode_cli.tar.gz

          # Dynamically locate the current user's home directory (resolves permission denied)
          USER_HOME=$(eval echo "~$(whoami)")
          CLI_DIR="$USER_HOME/.vscode/cli"

          echo "=== Cleaning up zombie locks from previous runs inside $USER_HOME ==="
          rm -f $CLI_DIR/servers/Stable-*/pid.txt
          rm -f $CLI_DIR/servers/Stable-*/log.txt

          echo "=== Provisioning environment auto-refresh settings ==="
          mkdir -p $CLI_DIR
          cat << 'EOF' > $CLI_DIR/settings.json
          {
            "terminal.integrated.environmentChangesRelaunch": true,
            "remote.tunnels.actions.onTunnelClose": "none",
            "workbench.startupEditor": "none"
          }
          EOF

          echo "=== Launching Tunnel ==="
          # Flag removed. The binary handles $VSCODE_SERVER_TOKEN behind the scenes
          timeout ${{inputs.time}}m ./code tunnel \
            --accept-server-license-terms \
            --name runnervmvrwv9 || true
          
          echo "Terminating server gracefully"
