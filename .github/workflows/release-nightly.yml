name: Release to Nightly
description: >
  For every push, a build of the repo
  is generated to be released as a nightly link.

on:
  workflow_dispatch: 
  workflow_call: 

jobs:
  build:
    runs-on: 'ubuntu-latest'
    permissions:
      contents: write
      attestations: write
      id-token: write
    steps:
      - name: Checkout Repo
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Setup Python
        uses: actions/setup-python@v7
        with:
          allow-prereleases: true
        
      - name: Find Latest Tag
        id: ltag
        run: |
          # AI-Generated
          git fetch --tags --prune
          latest_tag=$(git describe --tags --abbrev=0 origin/semver1.3.x)
          echo "tag=$latest_tag" >> $GITHUB_OUTPUT
      - name: Get Date and Time
        uses: kaven-universe/github-action-current-date-time@v1.5.0
        id: time
        with:
          format: "YYYYMMDDHHmm"
      - name: Automatically Update Version
        env:
          NVERSION: ${{ steps.ltag.outputs.tag }}.post${{ steps.time.outputs.time }}
          RELEASENVERSION: kms-semver1.3-nightly@${{ github.event.after }}
          NIGHTLY: "true"
        run: python3 test/automation/release.py
      - name: Download Build Tools & Build Package
        run: |
          python -m pip install --upgrade pip
          python -m pip install build
          python -m build
      - name: Generate Github Attestations
        # GH's attestations are different from PyPI's.
        uses: actions/attest@v4.2.2
        id: gh-attest
        with:
          subject-path: "dist/*"
      - name: Upload Wheel Artifact
        uses: actions/upload-artifact@v7
        id: whl
        with:
          path: dist/*.whl
          if-no-files-found: error
          archive: false
      - name: Upload gZip Artifact
        uses: actions/upload-artifact@v7
        id: gz
        with:
          path: dist/*.tar.gz
          if-no-files-found: error
          archive: false
      - name: Upload Full Package as zip archive
        uses: actions/upload-artifact@v7
        with:
          name: full-kms-semver-1-3-nightly
          path: dist/*
          if-no-files-found: error
          archive: true
      - name: Upload GH Attestations Artifact
        uses: actions/upload-artifact@v7
        with:
          name: full-kms-semver-1-3-nightly-attestations
          path: ${{steps.gh-attest.outputs.bundle-path}}
          if-no-files-found: error
          archive: true
      - name: Generate Nightly Link
        env:
          WHL: ${{  steps.whl.outputs.artifact-url }}
          GZ: ${{ steps.whl.outputs.artifact-url }}
        run: |
          echo "::notice title=Nightly .whl Link::${WHL/github.com/nightly.link}"
          echo "::notice title=Nightly .tar.gz Link::${GZ/github.com/nightly.link}"
          echo
          echo Nightly Build Complete.
  deploy:
    runs-on: ubuntu-latest
    environment: nightly
    needs: build
    permissions: read-all
    steps:
      - name: deploy to env
        run: |
          echo Build sucessful.
          echo Deploying to env 'nightly'.          

