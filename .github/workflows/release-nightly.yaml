name: Release to Nightly
description: >
  For every push, a build of the repo
  is generated to be released as a nightly link.

on:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: 'ubuntu-latest'
    steps:
      - name: Checkout Repo
        uses: actions/checkout@v6
      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Find Lastest Tag
        id: 'ltag'
        uses: oprypin/find-latest-tag@v1.1.2
        with:
          repository: ${{ github.repository }}
          sort-tags: false
      - name: Get Date and Time
        uses: kaven-universe/github-action-current-date-time@v1.5.0
        id: time
        with:
          format: "YYYYMMDDHHmm"
      - name: Automatically Update Version
        env:
          NVERSION: ${{ steps.ltag.outputs.tag }}.dev${{ steps.time.outputs.time }}
          RELEASENVERSION: kms-nightly${{ github.event.after }}
        run: python3 .github/workflows/src/release.py
      - name: Download Build Tools & Build Package
        run: |
          python -m pip install --upgrade pip
          python -m pip install build
          python -m build
      - name: Upload Wheel Artifact
        uses: actions/upload-artifact@v7
        id: whl
        with:
          path: dist/*.whl
          if-no-files-found: error
          archive: false
      - name: Upload gZip Artifact
        uses: actions/upload-artifact@v7
        id: gz
        with:
          path: dist/*.tar.gz
          if-no-files-found: error
          archive: false
      - name: Upload Full Package as zip archive
        uses: actions/upload-artifact@v7
        with:
          name: full-kms-nightly
          path: dist/*
          if-no-files-found: error
          archive: true
      - name: Generate Nightly Link
        env:
          WHL: ${{  steps.whl.outputs.artifact-url }}
          GZ: ${{ steps.whl.outputs.artifact-url }}
        run: |
          echo "::notice title=Nightly .whl Link::${WHL/github.com/nightly.link}"
          echo "::notice title=Nightly .tar.gz Link::${GZ/github.com/nightly.link}"
          echo
          echo Nightly Build Complete.
  deploy:
    runs-on: ubuntu-latest
    environment: nightly
    needs: build
    steps:
      - name: deploy to env
        run: |
          echo Build sucessful.
          echo Deploying to env 'nightly'.
          
