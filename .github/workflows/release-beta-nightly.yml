name: Release to Nightly (Beta)
description: >
  For every push, a beta build of the repo
  is generated to be released as a nightly link.

on:
  workflow_dispatch: 
  push:
    branches:
      - beta
    paths: 
      - 'test/**'
      - 'src/**'
      - 'pyproject.toml'
      - 'docs/**'
      - 'requirements.txt'

jobs:
  build:
    runs-on: 'ubuntu-latest'
    permissions:
      contents: write
    steps:
      - name: Checkout Repo
        uses: actions/checkout@v6
      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Get Date and Time
        uses: kaven-universe/github-action-current-date-time@v1.5.0
        id: time
        with:
          format: "YYYYMMDD"
      - name: Automatically Update Version
        env:
          NVERSION: 1.3.0.${{ steps.time.outputs.time }}b0
          RELEASENVERSION: kms-semver1.3.0@${{ github.event.after }}
        run: python3 .github/workflows/src/release.py
      - name: Download Build Tools & Build Package
        run: |
          python -m pip install --upgrade pip
          python -m pip install build
          python -m build
      - name: Upload Wheel Artifact
        uses: actions/upload-artifact@v7
        id: whl
        with:
          path: dist/*.whl
          if-no-files-found: error
          archive: false
      - name: Upload gZip Artifact
        uses: actions/upload-artifact@v7
        id: gz
        with:
          path: dist/*.tar.gz
          if-no-files-found: error
          archive: false
      - name: Upload Full Package as zip archive
        uses: actions/upload-artifact@v7
        with:
          name: full-kms-semver-1-3-nightly
          path: dist/*
          if-no-files-found: error
          archive: true
      - name: Generate Nightly Link
        env:
          WHL: ${{  steps.whl.outputs.artifact-url }}
          GZ: ${{ steps.whl.outputs.artifact-url }}
        run: |
          echo "::notice title=Nightly .whl Link::${WHL/github.com/nightly.link}"
          echo "::notice title=Nightly .tar.gz Link::${GZ/github.com/nightly.link}"
          echo
          echo Nightly Build Complete.
          
