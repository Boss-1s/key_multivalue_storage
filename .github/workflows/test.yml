name: Tests

on:
  push:
    branches-ignore:
      - releases/**
      - eol/**
      - docs
  pull_request:
    branches-ignore:
      - releases/**
      - eol/**
      - docs
  workflow_dispatch:

jobs:
  build:
    permissions:
      contents: read
      pull-requests: write
    strategy:
      matrix:
        py-ver: ['3.12', '3.13', '3.14']
        os: [ubuntu-latest, macos-latest, windows-latest]
      fail-fast: false
    runs-on: ${{ matrix.os }}
    steps:
      - name: Checkout repo
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      # Setup
      - parallel:
        - name: Setup Python
          uses: actions/setup-python@v7
          with:
            python-version: ${{ matrix.py-ver }}
  
        - name: Set up uv
          uses: astral-sh/setup-uv@v7
          with:
           enable-cache: true
  
      # Install dependencies....
      - name: Install requirements
        run: |
          pip install -r requirements.txt
          uv sync --group test

      - parallel:
        - name: Run Python Tests
          id: self-tests
          if: ${{ runner.os != 'Windows' }}
          run: uv run python test/
  
        - name: Run Python Tests (Windows)
          id: self-tests-w
          if: ${{ runner.os == 'Windows' }}
          env:
            TERM: 'dumb'
            PYTHONUTF8: '1'
          run: uv run python test/
  
        # - name: Display Breaking Changes (beta)
        #   if: ${{ github.ref_name == 'semver1.3.x' }}
        #   env:
        #     OLDTAG: 'v1.2.3.20260523.1'
        #   run: |
        #     uv run python test/diff.py

        - name: Lint using Pylint
          continue-on-error: true
          id: pylint
          run: uv run pylint --recursive=y key_multivalue_storage test/ .github/workflows/src/

        - name: Analyze with SonarQube
          uses: SonarSource/sonarqube-scan-action@v8.2.1
          env:
            GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
            SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
          with:
            projectBaseDir: src/
            args: >
              -Dsonar.projectKey=Boss-1s_key_multivalue_storage
              -Dsonar.organization=boss-1s
              -Dsonar.projectName=key_multivalue_storage
              -Dsonar.projectVersion=1.3.0.20260731
              -Dsonar.sources=src/
              -Dsonar.sourceEncoding=UTF-8
        
        - name: Lint pyproject.toml
          id: toml
          continue-on-error: true
          run: uv run pyproject check
  
        - name: Lint YAML Files
          id: yml
          if: ${{ runner.os == 'Linux' }}
          continue-on-error: true
          uses: reviewdog/action-actionlint@v1.73.0
          with:
            actionlint_flags: '-color -oneline'
            level: info
            fail_level: error
  
        - name: Lint Bash Files
          id: sh
          if: ${{ runner.os != 'Windows' }}
          continue-on-error: true
          uses: ludeeus/action-shellcheck@2.0.0
          with:
            ignore_paths: >-
              .venv/*
            severity: error

      - name: Fail job if steps failed
        if: |
          steps.self-tests.outcome == 'failure' ||
          steps.self-tests-w.outcome == 'failure' ||
          steps.pylint.outcome == 'failure' ||
          steps.toml.outcome == 'failure' ||
          steps.yml.outcome == 'failure' ||
          steps.sh.outcome == 'failure'
        run: |
          echo ::error Failed!:: A step may have failed, skipping deployment and failing job.
          exit 1

  nightly:
    needs: build
    permissions: write-all
    if: |
      github.ref_name == 'semver1.3.x' ||
      contains(github.ref_name, 'semver1.3.x')
    uses: ./.github/workflows/release-nightly.yml
        
  deploy-to-test:
    needs: build
    permissions:
      contents: read
    runs-on: ubuntu-latest
    environment: test
    if: |
      github.ref_name == 'semver1.3.x' ||
      contains(github.ref_name, 'semver1.3.x')
    steps:
      - run: |
          echo all jobs successful 
          echo deploying to environment test
  
