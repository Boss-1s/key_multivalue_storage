name: Tests

on:
  push:
    branches:
      - main
      - beta
      - dev
  pull_request:
    branches:
      - main
      - beta
  workflow_dispatch:

jobs:
  build:
    permissions:
      contents: read
    strategy:
      matrix:
        py-ver: ['3.12', '3.13', '3.14']
        os: [ubuntu-latest, macos-latest, windows-latest]
      fail-fast: false
    runs-on: ${{ matrix.os }}
    steps:
      - name: Checkout repo
        uses: actions/checkout@v6
      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.py-ver }}
      - name: Install Self
        run: python -m pip install -e .
      - name: Run test file
        run: |
          cd test
          python3 test-general.py

  deploy-to-test:
    needs: build
    permissions:
      contents: read
    runs-on: ubuntu-latest
    environment: test
    if: ${{ github.ref_name == 'main' }}
    steps:
      - run: |
          echo all jobs successful 
          echo deploying to environment test

  deploy-to-beta:
    needs: build
    permissions:
      contents: read
    runs-on: ubuntu-latest
    environment: test
    if: ${{ github.ref_name == 'beta' }}
    steps:
      - run: |
          echo all jobs successful 
          echo deploying to environment beta
          
