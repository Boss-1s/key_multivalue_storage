name: Tests

on:
  push:
    branches-ignore:
      - releases/**
      - eol/**
      - docs
  workflow_dispatch:

jobs:
  main:
    permissions:
      contents: read
      pull-requests: write
      security-events: write # allows SonarCloud to write reports directly to the Security and Quality tab.
      code-quality: write
      checks: write
    strategy:
      matrix:
        py-ver: ['3.12', '3.13', '3.14', '3.15']
        os: [ubuntu-latest, macos-latest, windows-latest]
      fail-fast: false
    runs-on: ${{ matrix.os }}
    steps:
      - name: Checkout repo
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      # Setup
      - parallel:
        - name: Setup Python
          uses: actions/setup-python@v7
          with:
            python-version: ${{ matrix.py-ver }}
            allow-prereleases: true

        - name: Set up uv
          uses: astral-sh/setup-uv@v10.0.1
          with:
           enable-cache: true

        - name: Find Latest Tag
          id: ltag
          shell: bash
          run: |
            # AI-Generated
            git fetch --tags --prune
            latest_tag=$(git describe --tags --abbrev=0 origin/semver1.3.x)
            echo "tag=$latest_tag" >> $GITHUB_OUTPUT

      - name: Install and Ensure Dependecies
        run: |
          uv python pin ${{ matrix.py-ver }}
          uv sync --group test
          uv run coverage --version
          uv run shellcheck --version
          uv run pylint --version
          uv run pyproject --version

      - name: Run Python Tests
        id: self-tests
        background: true
        run: |
          uv run coverage erase
          uv run coverage run test
          uv run coverage report
          uv run coverage xml

      - name: Lint using Pylint
        background: true
        id: pylint
        run: |
          uv run pylint --output-format=parseable:pylint-report.txt,colorized,json2:pylint_report.json  --recursive=y key_multivalue_storage test/ .github/workflows/src/

      - name: Lint pyproject.toml
        id: toml
        background: true
        run: |
          uv run pyproject check

      - name: Lint YAML Files
        id: yml
        background: true
        if: ${{ runner.os == 'Linux' }}
        uses: reviewdog/action-actionlint@a499b807aed4af40b8f2f7b885b9e38c469a945c
        with:
          actionlint_flags: |
            -color -oneline -format "{{json .}}" | tee /dev/tty | jq -s '{"issues": map(.[] | {engineId: "actionlint", ruleId: (.kind // "workflow-error"), severity: "MAJOR", type: "CODE_SMELL", primaryLocation: {message: .message, filePath: .filepath, textRange: {startLine: .line, startColumn: .column, endLine: .line}}})}' > actionlint-sonar.json
          level: info
          fail_level: error

      - name: Lint Bash Files
        id: sh
        background: true
        if: ${{ runner.os != 'Windows' }}
        run: |
          uv run shellcheck --version
          echo ""
          find . -path './.venv' -prune -o -name '*.sh' -exec uv run shellcheck --severity=error {} +

      - name: Wait for Pylint and Coverage
        wait: [pylint, self-tests]

      - name: Analyze with SonarCloud
        if: runner.os == 'Linux' && matrix.py-ver == '3.14'
        id: sc-analyze
        uses: SonarSource/sonarqube-scan-action@ad8210318ac8bb816e41990d5af2b304f7a6c213
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
          # Additional arguments for the SonarScanner CLI
          args:
            # Unique keys of your project and organization. You can find them in SonarCloud > Information (bottom-left menu)
            # mandatory
            -Dsonar.projectKey=Boss-1s_key_multivalue_storage
            -Dsonar.organization=boss-1s
            -Dsonar.projectName=key_multivalue_storage
            -Dsonar.projectVersion=${{ steps.ltag.outputs.tag }}
            -Dsonar.sources=src/key_multivalue_storage
            -Dsonar.tests=test
            -Dsonar.verbose=true
            -Dsonar.python.versions=3.12,3.13,3.14
            -Dsonar.python.pylint.reportPaths=pylint-report.txt
            -Dsonar.python.coverage.reportPaths=coverage.xml
            -Dsonar.githubactions.actionlint.reportPaths=actionlint.json
          projectBaseDir: .

      - name: SonarQube Quality Gate check
        if: runner.os == 'Linux' && matrix.py-ver == '3.14' && github.ref_name == 'semver1.3.x'
        id: sc-qg
        uses: sonarsource/sonarqube-quality-gate-action@8e9b0ca0a7273d6f16986388d98393efdfcf56fd
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}

      - name: Export Sonar Issues to SARIF File
        id: sc-sarif
        if: runner.os == 'Linux' && always() && matrix.py-ver == '3.14'
        uses: vmvarela/sonarqube-sarif@ee6c3c1d5314dd0d402277cd5099ab4578ddca74
        with:
          sonar-token: ${{ secrets.SONAR_TOKEN }}
          # For SonarCloud, use your project key you just set up in that popup box
          project-key: "Boss-1s_key_multivalue_storage"
          # Default SonarCloud API URL
          sonar-host-url: "https://sonarcloud.io"

      - name: Upload Code Scanning Results
        id: sc-upload
        if: runner.os == 'Linux' && always() && matrix.py-ver == '3.14'
        uses: github/codeql-action/upload-sarif@v4
        with:
          sarif_file: 'sonarqube.sarif'

      - wait-all:

  codeql:
    uses: ./.github/workflows/codeql.yml
    if: always()


  nightly:
    needs: [main, codeql]
    uses: ./.github/workflows/release-nightly.yml
    if: |
      contains(github.ref_name, 'semver1.') ||
      contains(github.actor, 'renovate') ||
      contains(github.actor, 'dependabot') ||
      contains(github.actor, 'github-actions')

  deploy:
    environment: test
    needs: [main, codeql]
    runs-on: 'ubuntu-latest'
    steps:
      - run: echo "Deploying to test environment..."
