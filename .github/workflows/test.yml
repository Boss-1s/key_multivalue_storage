name: Tests

on:
  push:
    branches:
      - main
      - beta
      - dev
  pull_request:
    branches:
      - main
      - beta
  workflow_dispatch:

jobs:
  build:
    permissions:
      contents: read
    strategy:
      matrix:
        py-ver: ['3.12', '3.13', '3.14']
        os: [ubuntu-latest, macos-latest, windows-latest]
      fail-fast: false
    runs-on: ${{ matrix.os }}
    steps:
      - name: Checkout repo
        uses: actions/checkout@v6
      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.py-ver }}
        # --- ULTRA FAST WINDOWS TESTING (NO PYTEST) ---
      - name: Set up uv
        uses: astral-sh/setup-uv@v5
        if: ${{ runner.os == 'Windows' }}
        with:
         enable-cache: true

      - name: Run Raw Python Tests
        if: ${{ runner.os == 'Windows' }}
        run: uv run --with . python test/test-general.py

      - name: Install Self
        if: ${{ runner.os != 'Windows' }}
        run: python -m pip install -e .

      - name: Run test file
        if: ${{ runner.os != 'Windows' }}
        run: python3 test/test-general.py

  deploy-to-test:
    needs: build
    permissions:
      contents: read
    runs-on: ubuntu-latest
    environment: test
    if: ${{ github.ref_name == 'main' }}
    steps:
      - run: |
          echo all jobs successful
          echo deploying to environment test

  deploy-to-beta:
    needs: build
    permissions:
      contents: read
    runs-on: ubuntu-latest
    environment: beta
    if: ${{ github.ref_name == 'beta' }}
    steps:
      - uses: actions/checkout@v6
      - name: Display Breaking Changes
        run: python test/diff.py
      - run: |
          echo all jobs successful
          echo deploying to environment beta

